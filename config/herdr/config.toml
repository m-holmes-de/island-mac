# herdr — terminal workspace manager for AI coding agents.
# island-mac managed default. Full reference: `herdr --default-config`.
# After editing, reload a running server with: `herdr server reload-config`.

# Onboarding already completed by island-mac; don't prompt on startup.
onboarding = false

[theme]
# Theme managed by island-theme-set (tracks the active island-mac theme).
name = "rose-pine"

[terminal]
# New panes/tabs/workspaces inherit the launching pane's directory.
new_cwd = "follow"

[keys]
# tmux-like keymap. Prefix is ctrl+space (matches the island-mac tmux prefix);
# macOS's ctrl+space input-source hotkey is disabled by an island-mac migration
# so herdr sees it.
prefix = "ctrl+space"

# Prefix-less pane focus, vim / tmux-navigator style (ctrl+h/j/k/l).
# NOTE: herdr has no vim-aware passthrough, so these capture ctrl+h/j/k/l from
# pane apps too — you lose ^L (clear screen), ^J (newline), ^K (kill-line) and
# ^H inside panes. Switch any that bite back to a prefix chord (e.g. prefix+l).
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Panes (prefix): split / zoom / close / resize-mode — tmux style.
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"
zoom             = "prefix+z"
close_pane       = "prefix+x"
resize_mode      = "prefix+r"

# Tabs = tmux "windows" (prefix): new / next / prev / jump.
new_tab      = "prefix+c"
next_tab     = "prefix+n"
previous_tab = "prefix+p"
switch_tab   = "prefix+1..9"

# Agents — herdr-specific panel. Now the primary unit of movement: prefix+u/i
# walk previous/next agent (adjacent keys, no collision with prefix+p = prev-tab).
previous_agent = "prefix+u"         # focus the previous agent
next_agent     = "prefix+i"         # focus the next agent
focus_agent    = "prefix+alt+1..9"  # jump straight to agent N

# Workspaces (prefix): walk previous/next on d/f — adjacent home-row keys, both
# free of herdr defaults (close_workspace is prefix+shift+d, not prefix+d).
previous_workspace = "prefix+d"  # focus the previous workspace
next_workspace     = "prefix+f"  # focus the next workspace

[session]
# After a server restart, resume AI-agent panes into their native sessions.
resume_agents_on_restore = true

[ui]
# Group the agent panel by space rather than the attention queue.
agent_panel_sort = "spaces"

[ui.sound]
# Audible cue when a background agent finishes or needs attention.
enabled = true

[ui.toast]
# Desktop notification when an agent needs you while herdr is backgrounded.
delivery = "system"
